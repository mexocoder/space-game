<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Твое Имя — Anime Cinematic by Mexocoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Аниме-стартовый экран */
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(30,20,60,0.95) 0%, rgba(5,2,15,0.99) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 1s ease;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 36px;
            letter-spacing: 6px;
            color: #ffb7c5; /* Нежно-розовый аниме-оттенок */
            text-shadow: 0 0 25px rgba(255, 183, 197, 0.8);
            font-weight: 300;
        }
        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            color: #8be9fd;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .author-tag {
            font-size: 15px;
            color: #ff79c6;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 121, 198, 0.6);
        }
        button.start-btn {
            padding: 16px 45px;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 600;
            background: linear-gradient(135deg, #ff79c6 0%, #bd93f9 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(189, 147, 249, 0.6);
            transition: transform 0.2s;
        }
        button.start-btn:active {
            transform: scale(0.95);
        }

        /* Кинематографичные субтитры внизу */
        #subtitles {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #f8f8f2;
            font-size: 18px;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="subtitle">MINI-ANIME CINEMATIC EXPERIENCE</div>
        <h1>ТВОЕ ИМЯ</h1>
        <div class="author-tag">by Mexocoder</div>
        <button class="start-btn" onclick="launchCinematic()">СМОТРЕТЬ ФИЛЬМ</button>
    </div>

    <div id="subtitles">...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let clouds = [];
        let starsMesh;
        let isPlaying = false;
        let cinematicTime = 0;

        const subs = [
            { time: 2, text: "«Тебе не кажется, что в этом небе есть что-то завораживающее?..»" },
            { time: 7, text: "Мы взмываем сквозь облака туда, где звезды касаются земли." },
            { time: 13, text: "«Если мы забудем имена друг друга... как мы найдемся?»" },
            { time: 19, text: "Падение сквозь бесконечный свет..." },
            { time: 25, text: "Directed & Coded by Mexocoder" }
        ];

        function launchCinematic() {
            // Автоматический полный экран
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 1000);

            init3D();
            isPlaying = true;
            cinematicTime = 0;
            animate();
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050210);
            scene.fog = new THREE.FogExp2(0x100826, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, 300);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambient = new THREE.AmbientLight(0xffb7c5, 0.7);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x8be9fd, 1.2);
            dirLight.position.set(100, 200, 100);
            scene.add(dirLight);

            // Звездное небо
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(4000 * 3);
            for (let i = 0; i < 4000 * 3; i += 3) {
                starPos[i] = (Math.random() - 0.5) * 2000;
                starPos[i+1] = (Math.random() - 0.5) * 2000;
                starPos[i+2] = (Math.random() - 0.5) * 2000;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.5, transparent: true, opacity: 0.8 });
            starsMesh = new THREE.Points(starGeo, starMat);
            scene.add(starsMesh);

            // Создание пушистых облаков (в стиле аниме)
            const cloudGeo = new THREE.SphereGeometry(35, 16, 16);
            const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffeef5, transparent: true, opacity: 0.35 });

            for (let i = 0; i < 80; i++) {
                const mesh = new THREE.Mesh(cloudGeo, cloudMat);
                mesh.position.set(
                    (Math.random() - 0.5) * 800,
                    (Math.random() - 0.5) * 600 - 100,
                    (Math.random() - 0.5) * 1200
                );
                mesh.scale.set(Math.random() * 3 + 1, Math.random() * 0.8 + 0.5, Math.random() * 3 + 1);
                scene.add(mesh);
                clouds.push(mesh);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function updateSubtitles(time) {
            const subEl = document.getElementById('subtitles');
            let currentText = "";
            for (let i = 0; i < subs.length; i++) {
                if (time >= subs[i].time && (i === subs[i].length || time < (subs[i+1]?.time || 999))) {
                    currentText = subs[i].text;
                }
            }

            if (currentText && subEl.innerText !== currentText) {
                subEl.innerText = currentText;
                subEl.style.opacity = '1';
            } else if (!currentText) {
                subEl.style.opacity = '0';
            }
        }

        function animate() {
            if (!isPlaying) return;
            requestAnimationFrame(animate);

            cinematicTime += 0.016; // Секунды

            // Режиссура камеры (Сценарий «Твое имя»)
            if (cinematicTime < 10) {
                // Фаза 1: Медленный подлет вверх сквозь звезды
                camera.position.z -= 0.8;
                camera.position.y += 0.3;
                camera.rotation.x = -0.15;
            } else if (cinematicTime < 22) {
                // Фаза 2: Эпичное падение вниз сквозь облака
                camera.position.y -= 1.2;
                camera.position.z += 0.4;
                camera.rotation.x = 0.35;
                camera.rotation.z = Math.sin(cinematicTime * 0.5) * 0.1;
            } else {
                // Фаза 3: Финальный панорамный облет
                camera.position.x = Math.sin(cinematicTime * 0.3) * 200;
                camera.position.z = Math.cos(cinematicTime * 0.3) * 200;
                camera.position.y = 50;
                camera.rotation.x = 0;
                camera.rotation.y = -cinematicTime * 0.3;
                camera.rotation.z = 0;
            }

            // Плавное вращение звезд
            starsMesh.rotation.y += 0.0005;

            // Движение облаков
            clouds.forEach(c => {
                c.position.z += 0.5;
                if (c.position.z > 200) c.position.z = -1000;
            });

            updateSubtitles(cinematicTime);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
