<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Solar System by Mexocoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Стартовый экран */
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(15,15,35,0.95) 0%, rgba(2,2,8,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 0.6s ease;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 26px;
            letter-spacing: 3px;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        .author-tag {
            font-size: 14px;
            color: #4facfe;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        p {
            color: #a0aec0;
            margin-bottom: 25px;
            font-size: 13px;
            text-align: center;
            line-height: 1.4;
        }
        button.start-btn {
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
        }

        /* Улучшенный виртуальный Джойстик */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            z-index: 20;
            display: none;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(0, 242, 254, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            pointer-events: none;
        }

        /* Едва заметная кнопка скрытия UI для скриншотов */
        #hide-ui-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>СОЛНЕЧНАЯ СИСТЕМА 3D</h1>
        <div class="author-tag">by Mexocoder</div>
        <p>ПК: WASD / Стрелки + Мышь<br>Мобильные: Плавный джойстик + Свайп</p>
        <button class="start-btn" onclick="launchApp()">ИССЛЕДОВАТЬ КОСМОС</button>
    </div>

    <div id="hide-ui-btn" onclick="toggleUI()">👁</div>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <canvas id="webglCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let planets = [];
        let moveState = { forward: 0, right: 0 };
        let isDragging = false;
        let previousPointerPos = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };
        let uiVisible = true;

        // Переменные джойстика
        let activePointerId = null;
        let joystickCenter = { x: 0, y: 0 };

        function launchApp() {
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) docElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            init3D();
        }

        function toggleUI() {
            uiVisible = !uiVisible;
            const joystick = document.getElementById('joystick-zone');
            if (isTouchDevice()) {
                joystick.style.display = uiVisible ? 'block' : 'none';
            }
            document.getElementById('hide-ui-btn').style.opacity = uiVisible ? '0.3' : '0.05';
        }

        function isTouchDevice() {
            return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        }

        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(180,220,255,0.8)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 35, 130);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webglCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Источник света от Солнца
            const sunLight = new THREE.PointLight(0xffffff, 2.5, 4000, 0.5);
            scene.add(sunLight);

            const ambientLight = new THREE.AmbientLight(0x151525);
            scene.add(ambientLight);

            // СОЛНЦЕ с эффектом сияния (Шаг 3: Корона)
            const sunGeo = new THREE.SphereGeometry(12, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const sunMesh = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sunMesh);

            // Внешнее свечение Солнца (Corona)
            const coronaGeo = new THREE.SphereGeometry(15, 32, 32);
            const coronaMat = new THREE.MeshBasicMaterial({
                color: 0xff4500,
                transparent: true,
                opacity: 0.35,
                blending: THREE.AdditiveBlending
            });
            sunMesh.add(new THREE.Mesh(coronaGeo, coronaMat));

            // ПЛАНЕТЫ
            const planetData = [
                { name: 'Меркурий', size: 1.2, dist: 24, speed: 0.03, color: 0x888888 },
                { name: 'Венера', size: 2.2, dist: 36, speed: 0.02, color: 0xe3bb76 },
                { name: 'Земля', size: 2.6, dist: 50, speed: 0.015, color: 0x2266ff },
                { name: 'Марс', size: 1.8, dist: 66, speed: 0.01, color: 0xcc4422 },
                { name: 'Юпитер', size: 6.0, dist: 95, speed: 0.006, color: 0xd4a373 },
                { name: 'Сатурн', size: 4.8, dist: 130, speed: 0.004, color: 0xf4e285, hasRings: true }
            ];

            planetData.forEach(data => {
                const geo = new THREE.SphereGeometry(data.size, 32, 32);
                const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7, metalness: 0.2 });
                const mesh = new THREE.Mesh(geo, mat);

                if (data.hasRings) {
                    const ringGeo = new THREE.RingGeometry(data.size * 1.4, data.size * 2.3, 32);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xc2a878, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2;
                    mesh.add(ringMesh);
                }

                scene.add(mesh);

                planets.push({
                    mesh: mesh,
                    dist: data.dist,
                    speed: data.speed,
                    angle: Math.random() * Math.PI * 2
                });
            });

            createStarField();
            setupControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createStarField() {
            const count = 3500;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                pos[i]     = (Math.random() - 0.5) * 3500;
                pos[i + 1] = (Math.random() - 0.5) * 3500;
                pos[i + 2] = (Math.random() - 0.5) * 3500;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.PointsMaterial({
                size: 7,
                map: createStarTexture(),
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const starMesh = new THREE.Points(geo, mat);
            scene.add(starMesh);
        }

        function setupControls() {
            // Управление клавиатурой (ПК)
            window.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = 1;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.forward = -1;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.right = -1;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = 1;
            });

            window.addEventListener('keyup', (e) => {
                if (['KeyW', 'KeyS', 'ArrowUp', 'ArrowDown'].includes(e.code)) moveState.forward = 0;
                if (['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight'].includes(e.code)) moveState.right = 0;
            });

            // Обзор мышкой / свайпом в свободном пространстве
            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#joystick-zone')) return;
                isDragging = true;
                previousPointerPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousPointerPos.x;
                const deltaY = e.clientY - previousPointerPos.y;

                cameraRotation.y -= deltaX * 0.004;
                cameraRotation.x -= deltaY * 0.004;
                cameraRotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraRotation.x));

                previousPointerPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => { isDragging = false; });

            // Абсолютно плавный и надежный Джойстик на Pointer Events
            if (isTouchDevice()) {
                const zone = document.getElementById('joystick-zone');
                const stick = document.getElementById('joystick-stick');
                zone.style.display = 'block';

                zone.addEventListener('pointerdown', (e) => {
                    activePointerId = e.pointerId;
                    zone.setPointerCapture(activePointerId);
                    const rect = zone.getBoundingClientRect();
                    joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                    updateJoystick(e.clientX, e.clientY, stick);
                });

                zone.addEventListener('pointermove', (e) => {
                    if (e.pointerId !== activePointerId) return;
                    updateJoystick(e.clientX, e.clientY, stick);
                });

                const endJoystick = (e) => {
                    if (e.pointerId !== activePointerId) return;
                    activePointerId = null;
                    stick.style.transform = 'translate(0px, 0px)';
                    moveState.forward = 0;
                    moveState.right = 0;
                };

                zone.addEventListener('pointerup', endJoystick);
                zone.addEventListener('pointercancel', endJoystick);
            }
        }

        function updateJoystick(clientX, clientY, stickElement) {
            const dx = clientX - joystickCenter.x;
            const dy = clientY - joystickCenter.y;
            const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 42);
            const angle = Math.atan2(dy, dx);

            const stickX = Math.cos(angle) * dist;
            const stickY = Math.sin(angle) * dist;

            stickElement.style.transform = `translate(${stickX}px, ${stickY}px)`;

            // Плавное пропорциональное управление скоростью
            moveState.right = stickX / 42;
            moveState.forward = -stickY / 42;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Орбиты планет
            planets.forEach(p => {
                p.angle += p.speed * 0.4;
                p.mesh.position.x = Math.cos(p.angle) * p.dist;
                p.mesh.position.z = Math.sin(p.angle) * p.dist;
                p.mesh.rotation.y += 0.012;
            });

            // Поворот камеры
            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraRotation.y;
            camera.rotation.x = cameraRotation.x;

            // Движение вперед/назад/вбок
            const moveSpeed = 1.4;
            if (moveState.forward !== 0) camera.translateZ(-moveState.forward * moveSpeed);
            if (moveState.right !== 0) camera.translateX(moveState.right * moveSpeed);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
