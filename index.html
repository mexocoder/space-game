<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Space Skybox</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 10, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-family: sans-serif;
            color: #fff;
            transition: opacity 0.5s ease;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        p {
            color: #a0aec0;
            margin-bottom: 25px;
            font-size: 14px;
        }
        button {
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>КОСМИЧЕСКИЙ СИМУЛЯТОР</h1>
        <p>Нажмите для запуска в полный экран</p>
        <button onclick="launchExperience()">ИССЛЕДОВАТЬ</button>
    </div>

    <canvas id="webglCanvas"></canvas>

    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };

        function launchExperience() {
            // Полноэкранный режим и фиксация горизонтали
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) docElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            // Плавное скрытие стартового меню
            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            init3D();
        }

        function init3D() {
            // 1. Создаем сцену
            scene = new THREE.Scene();

            // 2. Настраиваем камеру
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.1);

            // 3. Рендерер
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webglCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // 4. ЗАГРУЖАЕМ ТЕКСТУРУ КОСМОСА (Skybox сфера)
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('space.jpg', (texture) => {
                const skyGeometry = new THREE.SphereGeometry(500, 60, 40);
                // Отзеркаливаем сферу изнутри, чтобы текстура была видна из центра
                skyGeometry.scale(-1, 1, 1); 

                const skyMaterial = new THREE.MeshBasicMaterial({ map: texture });
                const skySphere = new THREE.Mesh(skyGeometry, skyMaterial);
                scene.add(skySphere);
            });

            // 5. Управление касаниями и мышкой для свободного обзора 3D
            window.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraRotation.y -= deltaX * 0.005;
                cameraRotation.x -= deltaY * 0.005;

                // Ограничиваем угол наклона вверх/вниз, чтобы не переворачиваться вверх тормашками
                cameraRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotation.x));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = cameraRotation.y;
                camera.rotation.x = cameraRotation.x;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => { isDragging = false; });
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
