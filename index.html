<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Круг против Углов: Дуэль Копий (Хардкор)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #05070f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0a0f24 0%, #03050a 100%);
        }
        canvas {
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
            border: 2px solid #1a264a;
            border-radius: 8px;
            background: #04060d;
        }
        #sidebar {
            width: 320px;
            background: #090d1a;
            border-left: 2px solid #1a264a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        h2 {
            font-size: 18px;
            color: #00e5ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .boss-btn {
            background: #10172e;
            border: 1px solid #233563;
            color: #a0aec0;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .boss-btn:hover {
            background: #182449;
            color: #fff;
            border-color: #00e5ff;
        }
        .boss-btn.active {
            background: #1e2c56;
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        .boss-btn .tag {
            font-size: 11px;
            background: #00e5ff22;
            color: #00e5ff;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(9, 13, 26, 0.85);
            border: 1px solid #1a264a;
            padding: 10px 18px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        .hud-title {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
        }
        .hud-value {
            font-size: 20px;
            font-weight: bold;
            color: #00e5ff;
        }
        .boss-hp-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(9, 13, 26, 0.85);
            border: 1px solid #1a264a;
            padding: 12px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        .hp-fill {
            height: 8px;
            background: #ff0055;
            width: 100%;
            border-radius: 4px;
            transition: width 0.3s;
            box-shadow: 0 0 8px #ff0055;
        }
        .overlay-msg {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: scale(0.8);
            text-shadow: 0 0 20px rgba(255,0,85,0.8);
        }
        .overlay-msg.show {
            opacity: 1;
            transform: scale(1);
        }
        .reset-btn {
            background: #ff0055;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background: #ff2a75;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas" width="800" height="700"></canvas>

        <div class="hud-panel">
            <div class="hud-card">
                <div class="hud-title">Здоровье Круга</div>
                <div class="hud-value" id="player-hp">100%</div>
            </div>
            <div class="hud-card">
                <div class="hud-title">Чистых уклонений</div>
                <div class="hud-value" id="dodge-count">0</div>
            </div>
        </div>

        <div class="boss-hp-bar">
            <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
                <span style="font-size: 12px; font-weight: bold;" id="boss-name">ТРЕУГОЛЬНИК</span>
                <span style="font-size: 12px; color: #ff0055;" id="boss-hp-text">100% ХП</span>
            </div>
            <div style="background: #1a264a; height: 8px; border-radius: 4px; overflow: hidden;">
                <div class="hp-fill" id="boss-hp-fill"></div>
            </div>
        </div>

        <div id="status-msg" class="overlay-msg" style="color: #ff0055;">ПРОМАХ! ВРАГ СЛОМАН!</div>
    </div>

    <div id="sidebar">
        <h2>Боссы-Дуэлянты</h2>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">
            Количество копий точно равно числу углов. Уворачивайся, чтобы заставить врага разрушить себя!
        </p>

        <div id="boss-list" style="display: flex; flex-direction: column; gap: 8px;"></div>

        <button class="reset-btn" onclick="initGame()">Перезапустить Дуэль</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Конфигурация Боссов
        const BOSSES = [
            { name: "1. ТРЕУГОЛЬНИК", sides: 3, speed: 2.5, chargeTime: 70, spinSpeed: 0.02, desc: "3 Копья. Обучение." },
            { name: "2. КВАДРАТ", sides: 4, speed: 3.0, chargeTime: 60, spinSpeed: 0.03, desc: "4 Копья. Крестовой залп." },
            { name: "3. ПЯТИУГОЛЬНИК", sides: 5, speed: 3.5, chargeTime: 50, spinSpeed: 0.04, desc: "5 Копий. Быстрые тайминги." },
            { name: "4. ШЕСТИУГОЛЬНИК", sides: 6, speed: 4.0, chargeTime: 45, spinSpeed: 0.05, desc: "6 Копий. Вращение при атаке." },
            { name: "5. ДЕКАГОН", sides: 10, speed: 4.5, chargeTime: 40, spinSpeed: 0.07, desc: "10 Копий. Упреждение цели!" },
            { name: "6. ИКОСАГОН", sides: 20, speed: 5.0, chargeTime: 35, spinSpeed: 0.09, desc: "20 Копий. Смертельный веер." },
            { name: "7. ГЕКАТОНГОН", sides: 100, speed: 5.5, chargeTime: 30, spinSpeed: 0.12, desc: "100 Копий. Почти круг!" },
            { name: "8. МЕГАГОН", sides: 1000, speed: 6.0, chargeTime: 25, spinSpeed: 0.15, desc: "1,000,000 УГЛОВ! Безумие." }
        ];

        let currentBossIdx = 0;
        let player, boss, spears = [], particles = [], warnings = [];
        let keys = {};
        let dodgeCount = 0;
        let gameState = 'PLAYING'; // PLAYING, WIN, GAMEOVER

        // Обработка ввода
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            if (gameState === 'PLAYING') {
                player.x = e.clientX - rect.left;
                player.y = e.clientY - rect.top;
            }
        });

        // Инициализация боссов в сайдбаре
        const bossListEl = document.getElementById('boss-list');
        BOSSES.forEach((b, idx) => {
            const btn = document.createElement('div');
            btn.className = `boss-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerHTML = `
                <div>
                    <div style="font-weight:bold; font-size:13px;">${b.name}</div>
                    <div style="font-size:11px; color:#64748b;">${b.desc}</div>
                </div>
                <span class="tag">${b.sides} Углов</span>
            `;
            btn.onclick = () => selectBoss(idx);
            bossListEl.appendChild(btn);
        });

        function selectBoss(idx) {
            currentBossIdx = idx;
            document.querySelectorAll('.boss-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });
            initGame();
        }

        function initGame() {
            const bConfig = BOSSES[currentBossIdx];
            gameState = 'PLAYING';
            dodgeCount = 0;
            document.getElementById('dodge-count').innerText = dodgeCount;

            player = {
                x: 150,
                y: canvas.height / 2,
                radius: 12,
                hp: 100,
                speed: 6
            };

            boss = {
                x: canvas.width - 200,
                y: canvas.height / 2,
                radius: bConfig.sides > 50 ? 55 : 45,
                sides: bConfig.sides,
                angle: 0,
                hp: 100,
                state: 'CHARGING', // CHARGING, ATTACKING, RECOVERING
                timer: 0,
                config: bConfig
            };

            spears = [];
            particles = [];
            warnings = [];
            updateUI();
        }

        function spawnSpears() {
            const sides = boss.sides;
            const angleStep = (Math.PI * 2) / Math.min(sides, 36); // Визуальный лимит вылета на один кадр

            let playerHitThisSalvo = false;

            for (let i = 0; i < sides; i++) {
                let spearAngle = boss.angle + (i * (Math.PI * 2 / sides));
                
                // Упреждение цели для продвинутых боссов
                if (boss.sides >= 10 && i === 0) {
                    const dx = player.x - boss.x;
                    const dy = player.y - boss.y;
                    spearAngle = Math.atan2(dy, dx);
                }

                spears.push({
                    x: boss.x + Math.cos(spearAngle) * boss.radius,
                    y: boss.y + Math.sin(spearAngle) * boss.radius,
                    vx: Math.cos(spearAngle) * 16,
                    vy: Math.sin(spearAngle) * 16,
                    angle: spearAngle,
                    length: 80,
                    life: 60
                });
            }

            // Таймер проверки на промах после вылета всех копий
            setTimeout(() => {
                if (gameState === 'PLAYING') {
                    // Если игрок выжил в этом залпе
                    boss.hp -= 25; // Промах отнимает 25% ХП у босса!
                    dodgeCount++;
                    document.getElementById('dodge-count').innerText = dodgeCount;
                    
                    showStatusMsg("ЧИСТЫЙ СКИЛЛ! МИМО!", "#00e5ff");
                    createExplosion(boss.x, boss.y, "#ff0055", 15);

                    if (boss.hp <= 0) {
                        boss.hp = 0;
                        gameState = 'WIN';
                        createExplosion(boss.x, boss.y, "#ff0055", 100);
                        showStatusMsg("РАЗОРВАН ИЗНУТРИ!", "#00e5ff");
                    }
                    updateUI();
                }
            }, 300);
        }

        function updateUI() {
            document.getElementById('player-hp').innerText = `${Math.max(0, player.hp)}%`;
            document.getElementById('boss-hp-text').innerText = `${Math.max(0, boss.hp)}% ХП`;
            document.getElementById('boss-hp-fill').style.width = `${Math.max(0, boss.hp)}%`;
            document.getElementById('boss-name').innerText = boss.config.name;
        }

        function showStatusMsg(text, color) {
            const el = document.getElementById('status-msg');
            el.innerText = text;
            el.style.color = color;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 600);
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * 8 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    life: 40,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Движение игрока через WASD/Стрелки
            if (keys['KeyW'] || keys['ArrowUp']) player.y -= player.speed;
            if (keys['KeyS'] || keys['ArrowDown']) player.y += player.speed;
            if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;

            // Ограничение арены
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Логика Босса
            boss.angle += boss.config.spinSpeed;
            boss.timer++;

            if (boss.state === 'CHARGING') {
                if (boss.timer >= boss.config.chargeTime) {
                    boss.state = 'ATTACKING';
                    boss.timer = 0;
                    spawnSpears();
                }
            } else if (boss.state === 'ATTACKING') {
                if (boss.timer >= 20) {
                    boss.state = 'CHARGING';
                    boss.timer = 0;
                }
            }

            // Обновление Копий
            for (let i = spears.length - 1; i >= 0; i--) {
                let s = spears[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life--;

                // Проверка попадания в игрока
                const dist = Math.hypot(s.x - player.x, s.y - player.y);
                if (dist < player.radius + 10) {
                    player.hp -= 35;
                    createExplosion(player.x, player.y, "#00e5ff", 20);
                    spears.splice(i, 1);
                    updateUI();

                    if (player.hp <= 0) {
                        player.hp = 0;
                        gameState = 'GAMEOVER';
                        showStatusMsg("ПОРАЖЕНИЕ!", "#ff0055");
                    }
                    continue;
                }

                if (s.life <= 0) spears.splice(i, 1);
            }

            // ЧParticles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Сетка арены
            ctx.strokeStyle = '#0e172c';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Отрисовка Игрока (Круг)
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00e5ff';
            ctx.fillStyle = '#00e5ff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Отрисовка Босса (Многоугольник)
            if (gameState !== 'WIN') {
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.rotate(boss.angle);
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0055';
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 3;

                ctx.beginPath();
                const sides = Math.min(boss.sides, 60); // Для оптимизации отрисовки визуальных граней
                for (let i = 0; i < sides; i++) {
                    const a = (i * Math.PI * 2) / sides;
                    const bx = Math.cos(a) * boss.radius;
                    const by = Math.sin(a) * boss.radius;
                    if (i === 0) ctx.moveTo(bx, by);
                    else ctx.lineTo(bx, by);
                }
                ctx.closePath();
                ctx.stroke();

                // Пульсирующее Сердце Босса
                const pulse = Math.sin(Date.now() * 0.01) * 3;
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.arc(0, 0, 10 + pulse, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Предупреждающие лучи зарядки
                if (boss.state === 'CHARGING') {
                    ctx.save();
                    ctx.strokeStyle = `rgba(255, 0, 85, ${boss.timer / boss.config.chargeTime * 0.5})`;
                    ctx.lineWidth = 1;
                    const sides = Math.min(boss.sides, 24);
                    for (let i = 0; i < sides; i++) {
                        const a = boss.angle + (i * Math.PI * 2 / sides);
                        ctx.beginPath();
                        ctx.moveTo(boss.x, boss.y);
                        ctx.lineTo(boss.x + Math.cos(a) * 800, boss.y + Math.sin(a) * 800);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            // Отрисовка Копий
            spears.forEach(s => {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x - s.vx * 2, s.y - s.vy * 2);
                ctx.stroke();
                ctx.restore();
            });

            // Отрисовка Частиц
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();
    </script>
</body>
</html>
