<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Solar System by Mexocoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            touch-action: none;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Стартовый экран */
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(15,15,35,0.95) 0%, rgba(2,2,8,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 0.6s ease;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            letter-spacing: 3px;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        .author-tag {
            font-size: 14px;
            color: #4facfe;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: bold;
        }
        p {
            color: #a0aec0;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }
        button.start-btn {
            padding: 16px 38px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
        }

        /* Визуальный джойстик */
        #joystick-zone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(0, 242, 254, 0.2);
            border-radius: 50%;
            z-index: 20;
            display: none;
            touch-action: none;
            backdrop-filter: blur(4px);
        }
        #joystick-stick {
            position: absolute;
            top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(0, 242, 254, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            pointer-events: none;
        }

        /* Кнопка скрытия UI */
        #hide-ui-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>2D SPACE EXPLORER</h1>
        <div class="author-tag">by Mexocoder</div>
        <p>ПК: WASD / Стрелки<br>Мобильные: Удобный джойстик</p>
        <button class="start-btn" onclick="launchGame()">ИССЛЕДОВАТЬ</button>
    </div>

    <div id="hide-ui-btn" onclick="toggleUI()">👁</div>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let uiVisible = true;
        let isRunning = false;

        // Позиция и физика корабля
        const ship = {
            x: 0,
            y: -350, // Старт возле Земли
            vx: 0,
            vy: 0,
            angle: 0,
            speed: 6,
            radius: 12
        };

        // Ввод (WASD / Джойстик)
        const keys = {};
        let inputDir = { x: 0, y: 0 };

        // Джойстик
        let joystickPointerId = null;
        let joystickCenter = { x: 0, y: 0 };

        // Звездный фон
        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: (Math.random() - 0.5) * 4000,
                y: (Math.random() - 0.5) * 4000,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        // Солнечная система
        const planets = [
            { name: 'Меркурий', radius: 120, size: 7, color: '#a0a0a0', speed: 0.02, angle: Math.random() * Math.PI * 2 },
            { name: 'Венера', radius: 200, size: 12, color: '#e3bb76', speed: 0.014, angle: Math.random() * Math.PI * 2 },
            { name: 'Земля', radius: 320, size: 14, color: '#00d2ff', speed: 0.01, angle: Math.random() * Math.PI * 2, hasMoon: true },
            { name: 'Марс', radius: 460, size: 10, color: '#ff4d4d', speed: 0.007, angle: Math.random() * Math.PI * 2 },
            { name: 'Юпитер', radius: 680, size: 30, color: '#ffb366', speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: 'Сатурн', radius: 920, size: 24, color: '#e6c280', speed: 0.0025, angle: Math.random() * Math.PI * 2, hasRings: true }
        ];

        function isTouchDevice() {
            return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function launchGame() {
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) docElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 600);

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupControls();

            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function toggleUI() {
            uiVisible = !uiVisible;
            if (isTouchDevice()) {
                document.getElementById('joystick-zone').style.display = uiVisible ? 'block' : 'none';
            }
            document.getElementById('hide-ui-btn').style.opacity = uiVisible ? '0.4' : '0.05';
        }

        function setupControls() {
            // Клавиатура (ПК)
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            // Джойстик (Мобильные)
            if (isTouchDevice()) {
                const zone = document.getElementById('joystick-zone');
                const stick = document.getElementById('joystick-stick');
                zone.style.display = 'block';

                zone.addEventListener('pointerdown', e => {
                    joystickPointerId = e.pointerId;
                    zone.setPointerCapture(joystickPointerId);
                    const rect = zone.getBoundingClientRect();
                    joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                    updateJoystick(e.clientX, e.clientY, stick);
                });

                zone.addEventListener('pointermove', e => {
                    if (e.pointerId === joystickPointerId) {
                        updateJoystick(e.clientX, e.clientY, stick);
                    }
                });

                const endJoystick = e => {
                    if (e.pointerId === joystickPointerId) {
                        joystickPointerId = null;
                        stick.style.transform = 'translate(0px, 0px)';
                        inputDir = { x: 0, y: 0 };
                    }
                };

                zone.addEventListener('pointerup', endJoystick);
                zone.addEventListener('pointercancel', endJoystick);
            }
        }

        function updateJoystick(clientX, clientY, stickElement) {
            const dx = clientX - joystickCenter.x;
            const dy = clientY - joystickCenter.y;
            const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 42);
            const angle = Math.atan2(dy, dx);

            const stickX = Math.cos(angle) * dist;
            const stickY = Math.sin(angle) * dist;

            stickElement.style.transform = `translate(${stickX}px, ${stickY}px)`;

            inputDir.x = stickX / 42;
            inputDir.y = stickY / 42;
        }

        function updateLogic() {
            // Ввод с ПК (WASD)
            if (!isTouchDevice() || (inputDir.x === 0 && inputDir.y === 0)) {
                inputDir.x = 0;
                inputDir.y = 0;
                if (keys['KeyA'] || keys['ArrowLeft']) inputDir.x -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) inputDir.x += 1;
                if (keys['KeyW'] || keys['ArrowUp']) inputDir.y -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) inputDir.y += 1;

                // Нормализация вектора по диагонали
                const len = Math.sqrt(inputDir.x * inputDir.x + inputDir.y * inputDir.y);
                if (len > 0) {
                    inputDir.x /= len;
                    inputDir.y /= len;
                }
            }

            // Плавный занос и движение корабля
            ship.vx += inputDir.x * ship.speed * 0.15;
            ship.vy += inputDir.y * ship.speed * 0.15;
            ship.vx *= 0.92;
            ship.vy *= 0.92;

            ship.x += ship.vx;
            ship.y += ship.vy;

            // Поворот носа корабля по ходу движения
            if (Math.abs(ship.vx) > 0.1 || Math.abs(ship.vy) > 0.1) {
                ship.angle = Math.atan2(ship.vy, ship.vx);
            }

            // Движение планет по орбитам
            planets.forEach(p => {
                p.angle += p.speed * 0.5;
            });
        }

        function render() {
            ctx.fillStyle = '#020208';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Камера следит за кораблем
            ctx.translate(canvas.width / 2 - ship.x, canvas.height / 2 - ship.y);

            // 1. Звезды на заднем фоне (с эффектом глубины)
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Орбиты планет (неоновые кольца)
            planets.forEach(p => {
                ctx.strokeStyle = 'rgba(0, 242, 254, 0.08)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.stroke();
            });

            // 3. СОЛНЦЕ (Яркое 2D свечение)
            const sunGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, 90);
            sunGlow.addColorStop(0, '#ffffff');
            sunGlow.addColorStop(0.2, '#ffaa00');
            sunGlow.addColorStop(0.6, 'rgba(255, 69, 0, 0.4)');
            sunGlow.addColorStop(1, 'rgba(255, 69, 0, 0)');

            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(0, 0, 90, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.fill();

            // 4. ПЛАНЕТЫ
            planets.forEach(p => {
                const px = Math.cos(p.angle) * p.radius;
                const py = Math.sin(p.angle) * p.radius;

                // Кольца Сатурна
                if (p.hasRings) {
                    ctx.strokeStyle = 'rgba(230, 194, 128, 0.5)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(px, py, p.size * 1.8, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Тело планеты
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // Сброс тени

                // Луна вокруг Земли
                if (p.hasMoon) {
                    const mx = px + Math.cos(p.angle * 4) * 26;
                    const my = py + Math.sin(p.angle * 4) * 26;
                    ctx.fillStyle = '#cccccc';
                    ctx.beginPath();
                    ctx.arc(mx, my, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 5. КОРАБЛЬ ИГРОКА (Mexocoder Ship)
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);

            // Огонь из двигателя
            if (Math.abs(ship.vx) > 0.2 || Math.abs(ship.vy) > 0.2) {
                ctx.fillStyle = '#ff4d4d';
                ctx.shadowColor = '#ff4d4d';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(-12, -5);
                ctx.lineTo(-22 - Math.random() * 8, 0);
                ctx.lineTo(-12, 5);
                ctx.closePath();
                ctx.fill();
            }

            // Неоновый футуристичный треугольный корпус
            ctx.fillStyle = '#00f2fe';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(16, 0);
            ctx.lineTo(-12, -10);
            ctx.lineTo(-6, 0);
            ctx.lineTo(-12, 10);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            ctx.restore();
        }

        function gameLoop() {
            if (!isRunning) return;
            updateLogic();
            render();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
