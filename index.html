<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft 2D v1.12.2 by Mexocoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
            touch-action: none;
            font-family: 'Minecraft', 'Segoe UI', sans-serif;
            user-select: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }
        /* Меню запуска v1.12.2 */
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="%235c4033"/><rect width="32" height="8" fill="%23557a2b"/></svg>');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 0.5s ease;
        }
        h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 2px;
            color: #ffff55;
            text-shadow: 3px 3px 0px #3f3f00, 4px 4px 0px #000;
        }
        .version-tag {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #000;
        }
        .author-tag {
            font-size: 14px;
            color: #55ffff;
            margin-bottom: 25px;
            text-shadow: 1px 1px 0px #000;
        }
        button.start-btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            background: #707070;
            color: #fff;
            border: 2px solid #fff;
            box-shadow: inset -2px -2px 0px #373737, inset 2px 2px 0px #ffffff;
            cursor: pointer;
        }
        button.start-btn:active {
            background: #4a4a4a;
            box-shadow: inset 2px 2px 0px #373737;
        }

        /* Хотбар v1.12.2 */
        #hotbar-container {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #3c3c3c;
            padding: 3px;
            border-radius: 4px;
            z-index: 20;
        }
        .hotbar-slot {
            width: 38px;
            height: 38px;
            margin: 0 2px;
            background: rgba(139, 139, 139, 0.5);
            border: 2px solid #373737;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            position: relative;
            cursor: pointer;
        }
        .hotbar-slot.active {
            border: 2px solid #ffffff;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }
        .slot-count {
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-size: 10px;
            color: #fff;
            text-shadow: 1px 1px 0px #000;
        }

        /* Мобильные кнопки */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            pointer-events: none;
            z-index: 25;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .m-btn {
            width: 55px;
            height: 55px;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #hide-ui-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 34px;
            height: 34px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>MINECRAFT 2D</h1>
        <div class="version-tag">Java Edition 1.12.2</div>
        <div class="author-tag">by Mexocoder</div>
        <button class="start-btn" onclick="launchGame()">ОДИНОЧНАЯ ИГРА</button>
    </div>

    <div id="hide-ui-btn" onclick="toggleUI()">👁</div>

    <!-- Хотбар инвентаря -->
    <div id="hotbar-container"></div>

    <!-- Кнопки управления для телефона -->
    <div id="mobile-controls">
        <div class="btn-group">
            <div class="m-btn" id="btn-left">◀</div>
            <div class="m-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="m-btn" id="btn-jump">▲</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const BLOCK_SIZE = 32;
        const WORLD_WIDTH = 200;
        const WORLD_HEIGHT = 80;

        // Типы блоков v1.12.2
        const BLOCKS = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            WOOD: 4,
            LEAVES: 5,
            COAL_ORE: 6,
            IRON_ORE: 7,
            DIAMOND_ORE: 8,
            PLANKS: 9
        };

        const BLOCK_DATA = {
            [BLOCKS.GRASS]: { name: 'Трава', color: '#557a2b', sideColor: '#5c4033' },
            [BLOCKS.DIRT]: { name: 'Земля', color: '#5c4033' },
            [BLOCKS.STONE]: { name: 'Камень', color: '#737373' },
            [BLOCKS.WOOD]: { name: 'Древесина', color: '#3d2817' },
            [BLOCKS.LEAVES]: { name: 'Листва', color: '#2d4c1e' },
            [BLOCKS.COAL_ORE]: { name: 'Угольная руда', color: '#737373', spot: '#111111' },
            [BLOCKS.IRON_ORE]: { name: 'Железная руда', color: '#737373', spot: '#d8af93' },
            [BLOCKS.DIAMOND_ORE]: { name: 'Алмазная руда', color: '#737373', spot: '#55ffff' },
            [BLOCKS.PLANKS]: { name: 'Доски', color: '#a07844' }
        };

        // Хотбар (9 слотов как в Java 1.12.2)
        const hotbar = [
            { type: BLOCKS.GRASS, count: 64 },
            { type: BLOCKS.DIRT, count: 64 },
            { type: BLOCKS.STONE, count: 64 },
            { type: BLOCKS.WOOD, count: 32 },
            { type: BLOCKS.PLANKS, count: 64 },
            { type: BLOCKS.LEAVES, count: 64 },
            { type: BLOCKS.COAL_ORE, count: 16 },
            { type: BLOCKS.IRON_ORE, count: 12 },
            { type: BLOCKS.DIAMOND_ORE, count: 4 }
        ];
        let selectedSlot = 0;

        // Карта мира
        let world = Array.from({ length: WORLD_HEIGHT }, () => new Array(WORLD_WIDTH).fill(BLOCKS.AIR));

        // Стив (Персонаж)
        const player = {
            x: 100 * BLOCK_SIZE,
            y: 20 * BLOCK_SIZE,
            vx: 0,
            vy: 0,
            width: 20,
            height: 52,
            isGrounded: false,
            facing: 'right'
        };

        let keys = {};
        let isBreaking = false;
        let breakProgress = 0;
        let targetBlock = null;
        let uiVisible = true;
        let isRunning = false;

        function isTouchDevice() {
            return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        }

        // Процедурная генерация мира 1.12.2
        function generateWorld() {
            let surfaceY = 35;

            for (let x = 0; x < WORLD_WIDTH; x++) {
                surfaceY += Math.floor(Math.sin(x * 0.1) * 2) + Math.floor((Math.random() - 0.5) * 1.5);
                surfaceY = Math.max(20, Math.min(50, surfaceY));

                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    if (y === surfaceY) {
                        world[y][x] = BLOCKS.GRASS;
                        // Генерация деревьев
                        if (x > 5 && x < WORLD_WIDTH - 5 && Math.random() < 0.08) {
                            spawnTree(x, y - 1);
                        }
                    } else if (y > surfaceY && y <= surfaceY + 4) {
                        world[y][x] = BLOCKS.DIRT;
                    } else if (y > surfaceY + 4) {
                        // Генерация руд
                        const rand = Math.random();
                        if (y > 60 && rand < 0.02) world[y][x] = BLOCKS.DIAMOND_ORE;
                        else if (y > 45 && rand < 0.05) world[y][x] = BLOCKS.IRON_ORE;
                        else if (rand < 0.08) world[y][x] = BLOCKS.COAL_ORE;
                        else world[y][x] = BLOCKS.STONE;
                    }
                }
            }
            player.y = (surfaceY - 3) * BLOCK_SIZE;
        }

        function spawnTree(x, startY) {
            const height = 4 + Math.floor(Math.random() * 2);
            for (let i = 0; i < height; i++) {
                if (startY - i >= 0) world[startY - i][x] = BLOCKS.WOOD;
            }
            // Крона листвы
            const leafY = startY - height;
            for (let ly = leafY - 1; ly <= leafY + 1; ly++) {
                for (let lx = x - 2; lx <= x + 2; lx++) {
                    if (lx >= 0 && lx < WORLD_WIDTH && ly >= 0 && ly < WORLD_HEIGHT) {
                        if (world[ly][lx] === BLOCKS.AIR) world[ly][lx] = BLOCKS.LEAVES;
                    }
                }
            }
        }

        function renderHotbar() {
            const container = document.getElementById('hotbar-container');
            container.innerHTML = '';
            hotbar.forEach((slot, idx) => {
                const el = document.createElement('div');
                el.className = `hotbar-slot ${idx === selectedSlot ? 'active' : ''}`;
                el.onclick = () => selectedSlot = idx;

                const bData = BLOCK_DATA[slot.type];
                if (bData) {
                    el.style.backgroundColor = bData.color;
                    el.innerHTML = `<span class="slot-count">${slot.count}</span>`;
                }
                container.appendChild(el);
            });
        }

        function launchGame() {
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) docElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            generateWorld();
            renderHotbar();
            setupControls();

            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function toggleUI() {
            uiVisible = !uiVisible;
            document.getElementById('hotbar-container').style.display = uiVisible ? 'flex' : 'none';
            if (isTouchDevice()) {
                document.getElementById('mobile-controls').style.display = uiVisible ? 'flex' : 'none';
            }
            document.getElementById('hide-ui-btn').style.opacity = uiVisible ? '0.4' : '0.1';
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function setupControls() {
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                    selectedSlot = parseInt(e.code.replace('Digit', '')) - 1;
                    renderHotbar();
                }
            });

            window.addEventListener('keyup', e => keys[e.code] = false);

            // Клик мыши / Тап для ломания и постройки
            canvas.addEventListener('pointerdown', handleInteraction);
            canvas.addEventListener('pointerup', () => { isBreaking = false; breakProgress = 0; });

            if (isTouchDevice()) {
                document.getElementById('mobile-controls').style.display = 'flex';
                bindBtn('btn-left', 'KeyA');
                bindBtn('btn-right', 'KeyD');
                bindBtn('btn-jump', 'Space');
            }
        }

        function bindBtn(id, code) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', e => { e.preventDefault(); keys[code] = true; });
            btn.addEventListener('pointerup', e => { e.preventDefault(); keys[code] = false; });
            btn.addEventListener('pointercancel', e => { e.preventDefault(); keys[code] = false; });
        }

        function handleInteraction(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left + (player.x - canvas.width / 2);
            const clickY = e.clientY - rect.top + (player.y - canvas.height / 2);

            const gridX = Math.floor(clickX / BLOCK_SIZE);
            const gridY = Math.floor(clickY / BLOCK_SIZE);

            if (gridX < 0 || gridX >= WORLD_WIDTH || gridY < 0 || gridY >= WORLD_HEIGHT) return;

            // Расстояние взаимодействия
            const pGridX = Math.floor((player.x + player.width / 2) / BLOCK_SIZE);
            const pGridY = Math.floor((player.y + player.height / 2) / BLOCK_SIZE);

            if (Math.hypot(gridX - pGridX, gridY - pGridY) > 6) return; // Слишком далеко

            if (e.button === 2 || (isTouchDevice() && world[gridY][gridX] === BLOCKS.AIR)) {
                // ПОСТРОЙКА БЛОКА
                const currentSlot = hotbar[selectedSlot];
                if (currentSlot && currentSlot.count > 0 && world[gridY][gridX] === BLOCKS.AIR) {
                    world[gridY][gridX] = currentSlot.type;
                    currentSlot.count--;
                    renderHotbar();
                }
            } else {
                // ЛОМАНИЕ БЛОКА
                if (world[gridY][gridX] !== BLOCKS.AIR) {
                    world[gridY][gridX] = BLOCKS.AIR;
                }
            }
        }

        function updatePhysics() {
            // Движение по горизонтали
            player.vx = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -3.8; player.facing = 'left'; }
            if (keys['KeyD'] || keys['ArrowRight']) { player.vx = 3.8; player.facing = 'right'; }

            // Прыжок
            if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.isGrounded) {
                player.vy = -9.5;
                player.isGrounded = false;
            }

            // Гравитация
            player.vy += 0.45;

            // Коллизия по X
            player.x += player.vx;
            checkCollision(true);

            // Коллизия по Y
            player.y += player.vy;
            checkCollision(false);
        }

        function checkCollision(isX) {
            const startX = Math.floor(player.x / BLOCK_SIZE);
            const endX = Math.floor((player.x + player.width) / BLOCK_SIZE);
            const startY = Math.floor(player.y / BLOCK_SIZE);
            const endY = Math.floor((player.y + player.height) / BLOCK_SIZE);

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    if (y >= 0 && y < WORLD_HEIGHT && x >= 0 && x < WORLD_WIDTH) {
                        if (world[y][x] !== BLOCKS.AIR) {
                            if (isX) {
                                if (player.vx > 0) player.x = x * BLOCK_SIZE - player.width - 0.1;
                                else if (player.vx < 0) player.x = (x + 1) * BLOCK_SIZE + 0.1;
                            } else {
                                if (player.vy > 0) {
                                    player.y = y * BLOCK_SIZE - player.height;
                                    player.vy = 0;
                                    player.isGrounded = true;
                                } else if (player.vy < 0) {
                                    player.y = (y + 1) * BLOCK_SIZE;
                                    player.vy = 0;
                                }
                            }
                        }
                    }
                }
            }
        }

        function render() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Камера плавно следит за СТИВОМ
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            // Отрисовка видимых блоков
            const startX = Math.max(0, Math.floor((player.x - canvas.width / 2) / BLOCK_SIZE) - 2);
            const endX = Math.min(WORLD_WIDTH, Math.ceil((player.x + canvas.width / 2) / BLOCK_SIZE) + 2);
            const startY = Math.max(0, Math.floor((player.y - canvas.height / 2) / BLOCK_SIZE) - 2);
            const endY = Math.min(WORLD_HEIGHT, Math.ceil((player.y + canvas.height / 2) / BLOCK_SIZE) + 2);

            for (let y = startY; y < endY; y++) {
                for (let x = startX; x < endX; x++) {
                    const blockType = world[y][x];
                    if (blockType !== BLOCKS.AIR) {
                        const bData = BLOCK_DATA[blockType];
                        const bx = x * BLOCK_SIZE;
                        const by = y * BLOCK_SIZE;

                        ctx.fillStyle = bData.color;
                        ctx.fillRect(bx, by, BLOCK_SIZE, BLOCK_SIZE);

                        // Текстурный слой 1.12.2 (Трава сверху)
                        if (blockType === BLOCKS.GRASS) {
                            ctx.fillStyle = '#557a2b';
                            ctx.fillRect(bx, by, BLOCK_SIZE, 6);
                        }

                        // Вкрапления руды
                        if (bData.spot) {
                            ctx.fillStyle = bData.spot;
                            ctx.fillRect(bx + 6, by + 6, 8, 8);
                            ctx.fillRect(bx + 18, by + 16, 6, 6);
                        }

                        // Сетка блоков
                        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                        ctx.strokeRect(bx, by, BLOCK_SIZE, BLOCK_SIZE);
                    }
                }
            }

            // Отрисовка СТИВА (Персонаж)
            ctx.fillStyle = '#00aaaa'; // Голубая футболка Стива
            ctx.fillRect(player.x, player.y + 16, player.width, 20);

            ctx.fillStyle = '#0000aa'; // Синие джинсы
            ctx.fillRect(player.x, player.y + 36, player.width, 16);

            ctx.fillStyle = '#ffb884'; // Голова
            ctx.fillRect(player.x + (player.facing === 'right' ? 2 : -2), player.y, 16, 16);

            ctx.restore();
        }

        function gameLoop() {
            if (!isRunning) return;
            updatePhysics();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Отключение контекстного меню по правому клику
        window.oncontextmenu = (e) => e.preventDefault();
    </script>
</body>
</html>
