<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Sci-Fi Sandbox by Mexocoder</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03020a;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(20,10,40,0.95) 0%, rgba(2,2,10,0.99) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 0.6s ease;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 32px;
            letter-spacing: 4px;
            color: #00f2fe;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.9);
        }
        .author-tag {
            font-size: 15px;
            color: #ff007f;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
        }
        p {
            color: #a0aec0;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }
        button.start-btn {
            padding: 16px 42px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff007f 0%, #00f2fe 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            z-index: 10;
            font-size: 13px;
            pointer-events: none;
            display: none;
        }
        .hud-card {
            background: rgba(15, 10, 30, 0.75);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 10px;
            padding: 10px 15px;
            backdrop-filter: blur(5px);
            margin-bottom: 8px;
            box-shadow: 0 0 15px rgba(0,242,254,0.2);
        }
        .bar-bg {
            width: 110px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }
        .bar-fill-hp { width: 100%; height: 100%; background: #ff4757; transition: width 0.2s; }
        .bar-fill-shield { width: 100%; height: 100%; background: #00f2fe; transition: width 0.2s; }

        #joystick-zone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            z-index: 20;
            display: none;
            touch-action: none;
            backdrop-filter: blur(4px);
        }
        #joystick-stick {
            position: absolute;
            top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(0, 242, 254, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.9);
            pointer-events: none;
        }
        .mobile-btn {
            position: absolute;
            bottom: 35px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            z-index: 25;
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        #fire-btn {
            right: 30px;
            background: rgba(255, 0, 127, 0.4);
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }
        #warp-btn {
            right: 110px;
            background: rgba(0, 242, 254, 0.3);
            border: 2px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }
        #hide-ui-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>NEON SPACE SANDBOX</h1>
        <div class="author-tag">by Mexocoder</div>
        <p>Уничтожайте пиратов, исследуйте туманности и избегайте Черной Дыры!</p>
        <button class="start-btn" onclick="launchGame()">ПОГРУЖЕНИЕ</button>
    </div>

    <div id="hud">
        <div class="hud-card">
            <div>ЩИТЫ: <div class="bar-bg"><div id="shield-bar" class="bar-fill-shield"></div></div></div>
            <div style="margin-top: 4px;">КОРПУС: <div class="bar-bg"><div id="hp-bar" class="bar-fill-hp"></div></div></div>
        </div>
        <div class="hud-card">
            💎 КРИСТАЛЛЫ: <span id="credits-txt" style="color:#00f2fe; font-weight:bold;">0</span>
        </div>
        <div class="hud-card" id="status-card" style="color: #00f2fe;">
            СЕКТОР: БЕЗОПАСНО
        </div>
    </div>

    <div id="hide-ui-btn" onclick="toggleUI()">👁</div>

    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    <div id="fire-btn" class="mobile-btn">🔥</div>
    <div id="warp-btn" class="mobile-btn">⚡</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let uiVisible = true;
        let isRunning = false;
        let shakeTime = 0;

        const player = {
            x: 0,
            y: -350,
            vx: 0,
            vy: 0,
            angle: 0,
            speed: 0.28,
            hp: 100,
            maxHp: 100,
            shield: 100,
            maxShield: 100,
            credits: 0,
            isWarping: false
        };

        const keys = {};
        let inputDir = { x: 0, y: 0 };
        let joystickPointerId = null;
        let joystickCenter = { x: 0, y: 0 };

        let lasers = [];
        let enemyLasers = [];
        let particles = [];
        let asteroids = [];
        let crystals = [];
        let enemies = [];

        // Разноцветные космические туманности (Nebulae)
        const nebulae = [
            { x: -600, y: -400, radius: 450, color: 'rgba(255, 0, 127, 0.15)' },
            { x: 700, y: 500, radius: 550, color: 'rgba(0, 242, 254, 0.12)' },
            { x: -300, y: 800, radius: 400, color: 'rgba(112, 0, 255, 0.14)' },
            { x: 800, y: -600, radius: 500, color: 'rgba(255, 170, 0, 0.1)' }
        ];

        // Красочные звезды
        const starColors = ['#ffffff', '#00f2fe', '#ff007f', '#ffaa00', '#7000ff'];
        const stars = Array.from({ length: 600 }, () => ({
            x: (Math.random() - 0.5) * 5000,
            y: (Math.random() - 0.5) * 5000,
            size: Math.random() * 2.5 + 0.5,
            color: starColors[Math.floor(Math.random() * starColors.length)],
            alpha: Math.random() * 0.8 + 0.2
        }));

        // Черная Дыра
        const blackHole = { x: -1100, y: 900, radius: 45, gravityDist: 600 };

        // Планеты
        const planets = [
            { name: 'Меркурий', radius: 140, size: 8, color: '#a0a0a0', speed: 0.015, angle: 0 },
            { name: 'Венера', radius: 220, size: 13, color: '#e3bb76', speed: 0.01, angle: 1 },
            { name: 'Земля', radius: 360, size: 15, color: '#00d2ff', speed: 0.007, angle: 2 },
            { name: 'Марс', radius: 520, size: 11, color: '#ff4d4d', speed: 0.005, angle: 3 },
            { name: 'Юпитер', radius: 760, size: 32, color: '#ffb366', speed: 0.003, angle: 4 },
            { name: 'Сатурн', radius: 1020, size: 26, color: '#e6c280', speed: 0.002, angle: 5, hasRings: true }
        ];

        function isTouchDevice() {
            return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function spawnWorld() {
            // Астероиды
            for (let i = 0; i < 45; i++) {
                const ang = Math.random() * Math.PI * 2;
                const dist = 560 + Math.random() * 160;
                asteroids.push({
                    x: Math.cos(ang) * dist,
                    y: Math.sin(ang) * dist,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: 12 + Math.random() * 14,
                    hp: 30
                });
            }

            // Вражеские пираты
            for (let i = 0; i < 4; i++) {
                enemies.push({
                    x: (Math.random() - 0.5) * 1200,
                    y: (Math.random() - 0.5) * 1200,
                    vx: 0, vy: 0,
                    angle: 0,
                    hp: 50,
                    shootCooldown: 0
                });
            }
        }

        function launchGame() {
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) docElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('hud').style.display = 'block';
            }, 600);

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupControls();
            spawnWorld();

            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function toggleUI() {
            uiVisible = !uiVisible;
            if (isTouchDevice()) {
                document.getElementById('joystick-zone').style.display = uiVisible ? 'block' : 'none';
                document.getElementById('fire-btn').style.display = uiVisible ? 'flex' : 'none';
                document.getElementById('warp-btn').style.display = uiVisible ? 'flex' : 'none';
            }
            document.getElementById('hide-ui-btn').style.opacity = uiVisible ? '0.4' : '0.05';
        }

        function setupControls() {
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'Space') fireLaser();
                if (e.code === 'ShiftLeft') player.isWarping = true;
            });

            window.addEventListener('keyup', e => {
                keys[e.code] = false;
                if (e.code === 'ShiftLeft') player.isWarping = false;
            });

            if (isTouchDevice()) {
                const zone = document.getElementById('joystick-zone');
                const stick = document.getElementById('joystick-stick');
                const fireBtn = document.getElementById('fire-btn');
                const warpBtn = document.getElementById('warp-btn');

                zone.style.display = 'block';
                fireBtn.style.display = 'flex';
                warpBtn.style.display = 'flex';

                zone.addEventListener('pointerdown', e => {
                    joystickPointerId = e.pointerId;
                    zone.setPointerCapture(joystickPointerId);
                    const rect = zone.getBoundingClientRect();
                    joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                    updateJoystick(e.clientX, e.clientY, stick);
                });

                zone.addEventListener('pointermove', e => {
                    if (e.pointerId === joystickPointerId) updateJoystick(e.clientX, e.clientY, stick);
                });

                const endJoystick = e => {
                    if (e.pointerId === joystickPointerId) {
                        joystickPointerId = null;
                        stick.style.transform = 'translate(0px, 0px)';
                        inputDir = { x: 0, y: 0 };
                    }
                };

                zone.addEventListener('pointerup', endJoystick);
                zone.addEventListener('pointercancel', endJoystick);

                fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); fireLaser(); });
                warpBtn.addEventListener('pointerdown', e => { e.preventDefault(); player.isWarping = true; });
                warpBtn.addEventListener('pointerup', e => { e.preventDefault(); player.isWarping = false; });
            }
        }

        function updateJoystick(clientX, clientY, stickElement) {
            const dx = clientX - joystickCenter.x;
            const dy = clientY - joystickCenter.y;
            const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 42);
            const angle = Math.atan2(dy, dx);

            const stickX = Math.cos(angle) * dist;
            const stickY = Math.sin(angle) * dist;

            stickElement.style.transform = `translate(${stickX}px, ${stickY}px)`;

            inputDir.x = stickX / 42;
            inputDir.y = stickY / 42;
        }

        function fireLaser() {
            const speed = 13;
            lasers.push({
                x: player.x + Math.cos(player.angle) * 15,
                y: player.y + Math.sin(player.angle) * 15,
                vx: Math.cos(player.angle) * speed + player.vx,
                vy: Math.sin(player.angle) * speed + player.vy,
                life: 55
            });
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * 4 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    color,
                    life: 25 + Math.random() * 15
                });
            }
        }

        function updateLogic() {
            if (!isTouchDevice() || (inputDir.x === 0 && inputDir.y === 0)) {
                inputDir.x = 0; inputDir.y = 0;
                if (keys['KeyA'] || keys['ArrowLeft']) inputDir.x -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) inputDir.x += 1;
                if (keys['KeyW'] || keys['ArrowUp']) inputDir.y -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) inputDir.y += 1;

                const len = Math.sqrt(inputDir.x * inputDir.x + inputDir.y * inputDir.y);
                if (len > 0) { inputDir.x /= len; inputDir.y /= len; }
            }

            const currentSpeed = player.isWarping ? player.speed * 3.5 : player.speed;
            player.vx += inputDir.x * currentSpeed;
            player.vy += inputDir.y * currentSpeed;

            // Притягивание Черной Дыры
            const dxBH = blackHole.x - player.x;
            const dyBH = blackHole.y - player.y;
            const distBH = Math.sqrt(dxBH * dxBH + dyBH * dyBH);
            if (distBH < blackHole.gravityDist) {
                const force = (1 - distBH / blackHole.gravityDist) * 0.6;
                player.vx += (dxBH / distBH) * force;
                player.vy += (dyBH / distBH) * force;

                document.getElementById('status-card').innerText = '⚠️ ГРАВИТАЦИОННАЯ АНОМАЛИЯ!';
                document.getElementById('status-card').style.color = '#ff007f';
            } else {
                document.getElementById('status-card').innerText = 'СЕКТОР: БЕЗОПАСНО';
                document.getElementById('status-card').style.color = '#00f2fe';
            }

            player.vx *= 0.96;
            player.vy *= 0.96;
            player.x += player.vx;
            player.y += player.vy;

            if (Math.abs(player.vx) > 0.1 || Math.abs(player.vy) > 0.1) {
                player.angle = Math.atan2(player.vy, player.vx);
            }

            if (player.shield < player.maxShield) player.shield += 0.05;

            // Логика пиратов (AI)
            enemies.forEach((e, eIdx) => {
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 500) {
                    e.angle = Math.atan2(dy, dx);
                    e.vx += Math.cos(e.angle) * 0.12;
                    e.vy += Math.sin(e.angle) * 0.12;

                    // Стрельба по игроку
                    e.shootCooldown++;
                    if (e.shootCooldown > 70 && dist < 350) {
                        e.shootCooldown = 0;
                        enemyLasers.push({
                            x: e.x, y: e.y,
                            vx: Math.cos(e.angle) * 8,
                            vy: Math.sin(e.angle) * 8,
                            life: 60
                        });
                    }
                }

                e.vx *= 0.95; e.vy *= 0.95;
                e.x += e.vx; e.y += e.vy;
            });

            // Попадания лазеров игрока
            lasers.forEach((l) => {
                l.x += l.vx; l.y += l.vy; l.life--;

                // Попадания в астероиды
                asteroids.forEach((ast, aIdx) => {
                    const dx = l.x - ast.x; const dy = l.y - ast.y;
                    if (dx * dx + dy * dy < ast.size * ast.size) {
                        ast.hp -= 15; l.life = 0;
                        shakeTime = 4;
                        createExplosion(l.x, l.y, '#00f2fe', 5);

                        if (ast.hp <= 0) {
                            createExplosion(ast.x, ast.y, '#a0a0a0', 12);
                            crystals.push({ x: ast.x, y: ast.y, value: Math.floor(Math.random() * 10) + 5 });
                            asteroids.splice(aIdx, 1);
                        }
                    }
                });

                // Попадания во врагов
                enemies.forEach((en, eIdx) => {
                    const dx = l.x - en.x; const dy = l.y - en.y;
                    if (dx * dx + dy * dy < 400) {
                        en.hp -= 20; l.life = 0;
                        shakeTime = 6;
                        createExplosion(l.x, l.y, '#ff007f', 6);

                        if (en.hp <= 0) {
                            createExplosion(en.x, en.y, '#ff007f', 20);
                            crystals.push({ x: en.x, y: en.y, value: 40 });
                            enemies.splice(eIdx, 1);
                        }
                    }
                });
            });
            lasers = lasers.filter(l => l.life > 0);

            // Попадания лазеров врагов в игрока
            enemyLasers.forEach((el) => {
                el.x += el.vx; el.y += el.vy; el.life--;
                const dx = el.x - player.x; const dy = el.y - player.y;
                if (dx * dx + dy * dy < 250) {
                    el.life = 0;
                    shakeTime = 8;
                    if (player.shield > 0) player.shield -= 15;
                    else player.hp -= 10;
                    createExplosion(player.x, player.y, '#ff4757', 8);
                }
            });
            enemyLasers = enemyLasers.filter(el => el.life > 0);

            // Сбор кристаллов
            crystals.forEach((c, cIdx) => {
                const dx = player.x - c.x; const dy = player.y - c.y;
                if (dx * dx + dy * dy < 900) {
                    player.credits += c.value;
                    createExplosion(c.x, c.y, '#00f2fe', 6);
                    crystals.splice(cIdx, 1);
                }
            });

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
            particles = particles.filter(p => p.life > 0);

            planets.forEach(p => p.angle += p.speed * 0.5);

            document.getElementById('shield-bar').style.width = Math.max(0, player.shield / player.maxShield * 100) + '%';
            document.getElementById('hp-bar').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
            document.getElementById('credits-txt').innerText = player.credits;
        }

        function render() {
            // Градиентный космический фон вместо чисто черного
            const bgGradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 100,
                canvas.width / 2, canvas.height / 2, 1000
            );
            bgGradient.addColorStop(0, '#0a0518');
            bgGradient.addColorStop(1, '#020106');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            // Эффект тряски экрана при попадании
            let shakeX = 0, shakeY = 0;
            if (shakeTime > 0) {
                shakeX = (Math.random() - 0.5) * shakeTime * 2;
                shakeY = (Math.random() - 0.5) * shakeTime * 2;
                shakeTime--;
            }

            ctx.translate(canvas.width / 2 - player.x + shakeX, canvas.height / 2 - player.y + shakeY);

            // 1. Неоновые Космические Туманности (Nebula)
            nebulae.forEach(n => {
                const grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.radius);
                grad.addColorStop(0, n.color);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 2. Цветные Звезды
            stars.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.globalAlpha = s.alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 3. Черная Дыра
            const bhGrad = ctx.createRadialGradient(blackHole.x, blackHole.y, 10, blackHole.x, blackHole.y, blackHole.radius * 2);
            bhGrad.addColorStop(0, '#000000');
            bhGrad.addColorStop(0.5, '#ff007f');
            bhGrad.addColorStop(1, 'rgba(0,242,254,0)');
            ctx.fillStyle = bhGrad;
            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, blackHole.radius * 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, blackHole.radius, 0, Math.PI * 2);
            ctx.fill();

            // 4. Орбиты
            planets.forEach(p => {
                ctx.strokeStyle = 'rgba(0, 242, 254, 0.08)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.stroke();
            });

            // 5. Солнце
            const sunGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, 110);
            sunGlow.addColorStop(0, '#ffffff');
            sunGlow.addColorStop(0.2, '#ffaa00');
            sunGlow.addColorStop(0.6, 'rgba(255, 0, 127, 0.35)');
            sunGlow.addColorStop(1, 'rgba(255, 69, 0, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#ffcc00';
            ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.fill();

            // 6. Планеты
            planets.forEach(p => {
                const px = Math.cos(p.angle) * p.radius;
                const py = Math.sin(p.angle) * p.radius;

                if (p.hasRings) {
                    ctx.strokeStyle = 'rgba(230, 194, 128, 0.4)';
                    ctx.lineWidth = 8;
                    ctx.beginPath(); ctx.arc(px, py, p.size * 1.8, 0, Math.PI * 2); ctx.stroke();
                }

                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 7. Пираты
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.rotate(e.angle);

                ctx.fillStyle = '#ff007f';
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(14, 0); ctx.lineTo(-10, -8); ctx.lineTo(-10, 8);
                ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            });

            // 8. Астероиды
            ctx.fillStyle = '#7a7a9a';
            asteroids.forEach(ast => {
                ctx.beginPath(); ctx.arc(ast.x, ast.y, ast.size, 0, Math.PI * 2); ctx.fill();
            });

            // 9. Кристаллы
            ctx.fillStyle = '#00f2fe';
            ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 10;
            crystals.forEach(c => ctx.fillRect(c.x - 3, c.y - 3, 6, 6));
            ctx.shadowBlur = 0;

            // 10. Лазеры
            ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 3;
            ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 12;
            lasers.forEach(l => {
                ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - l.vx * 1.5, l.y - l.vy * 1.5); ctx.stroke();
            });

            ctx.strokeStyle = '#ff007f'; ctx.shadowColor = '#ff007f';
            enemyLasers.forEach(el => {
                ctx.beginPath(); ctx.moveTo(el.x, el.y); ctx.lineTo(el.x - el.vx * 1.5, el.y - el.vy * 1.5); ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // 11. Частицы
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
            });

            // 12. Корабль игрока
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            if (Math.abs(player.vx) > 0.1 || Math.abs(player.vy) > 0.1) {
                ctx.fillStyle = player.isWarping ? '#00f2fe' : '#ff007f';
                ctx.shadowColor = player.isWarping ? '#00f2fe' : '#ff007f';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(-12, -6); ctx.lineTo(-26 - Math.random() * 10, 0); ctx.lineTo(-12, 6);
                ctx.closePath(); ctx.fill();
            }

            ctx.fillStyle = '#00f2fe';
            ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(18, 0); ctx.lineTo(-12, -11); ctx.lineTo(-6, 0); ctx.lineTo(-12, 11);
            ctx.closePath(); ctx.fill();

            ctx.restore();
            ctx.restore();
        }

        function gameLoop() {
            if (!isRunning) return;
            updateLogic();
            render();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
